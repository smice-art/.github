name: "🐛 Bug Report"
description: Report a bug to help improve our Blender tools.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear and concise description of what the bug is.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Environment
      description: "Which Blender version and OS are you using? (e.g., Blender 4.2 on Windows 11)"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
